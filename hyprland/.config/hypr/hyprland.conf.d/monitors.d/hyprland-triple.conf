
# -------------------------------
# Hyprland monitor config (dock-safe)
# -------------------------------

# MacBook internal display (HiDPI)
monitorv2 {
  output = eDP-1
  mode = 2560x1600@60
  scale = 1.6666667    # Retina scaling
  position = 0x0
}

# Disable dock external outputs
monitorv2 {
  output = DP-1
  disabled = true
}
monitorv2 {
  output = DP-2
  disabled = true
}
monitorv2 {
  output = HDMI-A-1
  disabled = true
}
monitorv2 {
  output = HDMI-A-2
  disabled = true
}

# Disable other previously detected monitors
monitorv2 {
  output = desc:Technical Concepts Ltd 43S525
  disabled = true
}

# Optional: prevent XWayland apps from being blurry
xwayland {
  force_zero_scaling = true
}
